name: media_picker
description: Unified media management for Flutter. Pick images, videos, and documents from camera, gallery, or files with a single API.
version: 1.1.0
homepage: https://github.com/CosmosExmo/media_picker

publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  # file_picker 13 requires Flutter 3.38+
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^3.4.3
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Immutable Models
  freezed_annotation: ^3.1.0

  # Functional Programming
  dartz: ^0.10.1

  # Utilities
  uuid: ^4.6.0

  # Animations
  flutter_animate: ^4.5.2

  # Camera & Media
  flutter_image_compress: ^2.5.1
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  # Android Photo Picker'ı (useAndroidPhotoPicker) etkinleştirmek için gerekli
  image_picker_android: ^0.8.13+23
  image_picker_platform_interface: ^2.11.1
  wolt_modal_sheet: ^0.11.0
  # CosmosExmo fork of trailon/CamerAwesome: adds AGP 9 built-in Kotlin support
  camerawesome:
    git:
      url: https://github.com/CosmosExmo/CamerAwesome.git
      ref: 2.5.0-cosmos.1

  # Web
  file_picker: ^13.1.0

  # Permissions
  permission_handler: ^13.0.2

  # Device Orientation (sensor-based)
  native_device_orientation: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  json_serializable: ^6.14.1

  # Testing
  mockito: ^5.8.1
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - media_picker_assets/imgs/
